<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">DOT MD</title>
  <desc id="desc">蓝色圆角图标中叠放的文稿，以 MD 艺术字和暖色输入光标表示编辑与预览</desc>
  <defs>
    <linearGradient id="surface" x1="150" y1="115" x2="845" y2="930" gradientUnits="userSpaceOnUse">
      <stop stop-color="#77D6E2"/>
      <stop offset=".38" stop-color="#3998C7"/>
      <stop offset="1" stop-color="#344487"/>
    </linearGradient>
    <linearGradient id="paper" x1="259" y1="224" x2="765" y2="802" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F3FA"/>
    </linearGradient>
    <linearGradient id="ink" x1="297" y1="425" x2="729" y2="682" gradientUnits="userSpaceOnUse">
      <stop stop-color="#225980"/>
      <stop offset="1" stop-color="#17375F"/>
    </linearGradient>
    <linearGradient id="fold" x1="648" y1="208" x2="799" y2="377" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9EFF7"/>
      <stop offset="1" stop-color="#ACD4E6"/>
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientTransform="translate(296 158) rotate(58) scale(755)">
      <stop stop-color="#FFF" stop-opacity=".3"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="tileShadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="24" stdDeviation="27" flood-color="#182E5B" flood-opacity=".25"/>
    </filter>
    <filter id="pageShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="21" stdDeviation="24" flood-color="#163A6F" flood-opacity=".29"/>
    </filter>
  </defs>
  <rect x="76" y="76" width="872" height="872" rx="222" fill="url(#surface)" filter="url(#tileShadow)"/>
  <rect x="91" y="91" width="842" height="842" rx="207" fill="url(#light)" stroke="#FFF" stroke-opacity=".26" stroke-width="8"/>
  <rect x="282" y="225" width="585" height="620" rx="94" transform="rotate(8 574 535)" fill="#CBEAF4" opacity=".8"/>
  <path d="M309 208h339l169 169v347c0 58-36 94-94 94H309c-58 0-95-36-95-94V303c0-58 37-95 95-95Z" fill="url(#paper)" filter="url(#pageShadow)"/>
  <path d="M648 208v74c0 62 33 95 95 95h74Z" fill="url(#fold)"/>
  <path d="M648 208v74c0 62 33 95 95 95h74" fill="none" stroke="#FFF" stroke-opacity=".55" stroke-width="7"/>
  <path d="M291 678V439l107 142 91-142v239" fill="none" stroke="url(#ink)" stroke-width="67" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M569 439v239h50c79 0 123-45 123-119 0-75-44-120-123-120h-50Z" fill="none" stroke="url(#ink)" stroke-width="67" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M795 469v190" fill="none" stroke="#F08365" stroke-width="18" stroke-linecap="round"/>
  <path d="M309 750h295" fill="none" stroke="#A8CDDD" stroke-width="17" stroke-linecap="round" opacity=".7"/>
</svg>
